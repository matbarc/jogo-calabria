<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2761">
<title>Professor · Jogo de Investimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; font-size: 18px; overflow: hidden; }
  .shell { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 32px; border-bottom: 1px solid var(--panel); }
  .head .brand { font-weight: 700; color: var(--muted); font-size: 15px; }
  .head .brand b { color: var(--navy); }
  .joinpill { display: flex; align-items: center; gap: 14px; background: var(--panel); border-radius: 999px; padding: 6px 8px 6px 18px; font-weight: 700; color: var(--navy); }
  .joinpill .code { background: var(--navy); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 22px; letter-spacing: .08em; }
  .stage { flex: 1; min-height: 0; overflow: auto; padding: 28px 40px; }
  .stage.dark { background: var(--navy); color: #fff; }
  .foot { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--panel-2); flex-wrap: wrap; }
  .foot .spacer { flex: 1; }
  .foot .btn { padding: 12px 18px; font-size: 16px; }
  .foot .btn.primary { background: var(--gold); color: var(--navy); font-size: 18px; padding: 14px 26px; }
  .foot .status { font-weight: 700; color: var(--muted); }
  .foot .clock { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--navy); min-width: 80px; text-align: center; }
  .kbd { font-size: 12px; color: var(--muted); }

  /* login */
  .login { max-width: 460px; margin: 8vh auto 0; padding: 0 16px; }
  .login h1 { font-size: 40px; margin: 8px 0 18px; }
  .games { margin-top: 22px; }
  .games button { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 8px; background: var(--panel); border: 0; border-radius: 10px; color: var(--navy); font-weight: 700; text-align: left; }

  /* lobby */
  .lobby { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(380px, 1.1fr); gap: 40px; align-items: start; }
  .joinbig h1 { font-size: 44px; margin: 8px 0 18px; }
  .joinbig .url { font-size: 28px; font-weight: 700; color: var(--navy); }
  .joinbig .codebig { font-family: var(--serif); font-size: 110px; line-height: 1; color: var(--navy); letter-spacing: .06em; margin: 10px 0 18px; }
  .joinbig img { width: 230px; height: 230px; border-radius: 12px; border: 1px solid var(--line); background: #fff; padding: 8px; }
  .teams h2 { font-size: 28px; margin-bottom: 4px; }
  .teams .hint { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
  .tlist { display: grid; gap: 8px; }
  .trow { display: grid; grid-template-columns: 1fr 120px 120px 36px; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 8px 10px 8px 14px; border: 1px solid var(--panel); }
  .trow.headrow { background: none; border: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 0; padding-bottom: 0; }
  .trow .nm { font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 8px; min-width: 0; }
  .trow .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow input { width: 100%; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; font-weight: 700; text-align: right; }
  .trow .x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; }
  .trow .x:hover { color: var(--down); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--up); flex: none; }
  .dot.off { background: #C4CAD9; }
  .empty { color: var(--muted); padding: 22px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; }

  /* decide */
  .newsbig { max-width: 1200px; margin: 0 auto; padding-top: 2vh; }
  .newsbig .eyebrow { font-size: 16px; }
  .newsbig .bar { width: 120px; height: 7px; background: var(--gold); margin: 18px 0 26px; }
  .newsbig h1 { color: #fff; font-size: clamp(48px, 6.4vw, 96px); }
  .newsbig p.lead { color: #D6DCF2; font-size: clamp(22px, 2.3vw, 34px); margin: 22px 0 0; max-width: 1050px; }
  .newsbig .ask { color: var(--gold); font-weight: 700; font-size: 22px; margin-top: 30px; }
  .timerbig { position: absolute; right: 40px; top: 24px; font-family: var(--serif); font-weight: 700; font-size: 64px; color: var(--gold); }
  .timerbig.low { color: #FF8A7A; }
  .prices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 44px; }
  .prices .p { background: rgba(255,255,255,.07); border-radius: 10px; padding: 12px 16px; border-top: 5px solid var(--c); }
  .prices .p .n { color: #D6DCF2; font-weight: 700; font-size: 16px; }
  .prices .p .v { color: #fff; font-family: var(--serif); font-size: 28px; font-weight: 700; }
  .readygrid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .readygrid .t { padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 16px; background: rgba(255,255,255,.08); color: #AEB7DA; display: inline-flex; align-items: center; gap: 6px; }
  .readygrid .t.touched { color: #fff; background: rgba(255,255,255,.16); }
  .readygrid .t.ready { background: var(--up); color: #fff; }

  /* reveal */
  .reveal { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr); gap: 40px; align-items: start; }
  .reveal h1 { font-size: 52px; margin: 8px 0 22px; }
  table.px { width: 100%; border-collapse: collapse; font-size: 20px; }
  table.px th { background: var(--navy); color: #fff; padding: 12px 14px; text-align: center; font-weight: 700; }
  table.px th:first-child { text-align: left; }
  table.px td { padding: 12px 14px; border: 1px solid var(--line); text-align: center; }
  table.px td:first-child { text-align: left; font-weight: 800; color: var(--navy); }
  table.px td.now { font-weight: 800; }
  .whybox { margin-top: 20px; background: var(--panel); border-left: 7px solid var(--gold); padding: 18px 22px; border-radius: 6px; font-size: 22px; min-height: 96px; }
  .whybox .ask { color: var(--muted); font-style: italic; }
  .rank h2 { font-size: 26px; margin-bottom: 14px; }
  .rk { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--panel); }
  .rk .p { font-family: var(--serif); font-weight: 700; font-size: 24px; color: var(--navy); text-align: center; }
  .rk.first .p { background: var(--gold); border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; font-size: 20px; }
  .rk .nm { font-weight: 800; color: var(--navy); font-size: 20px; }
  .rk .barwrap { height: 8px; background: var(--panel); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .rk .barwrap div { height: 100%; background: var(--navy); border-radius: 4px; transition: width .6s ease; }
  .rk.first .barwrap div { background: var(--gold); }
  .rk .tot { text-align: right; font-weight: 800; font-size: 22px; color: var(--ink); }
  .rk .tot small { display: block; font-size: 15px; font-weight: 700; }
  .rank.compact .rk { padding: 4px 0; }
  .rank.compact .rk .nm { font-size: 17px; }
  .rank.compact .rk .tot { font-size: 18px; }

  /* final */
  .final { display: grid; grid-template-columns: minmax(460px, 1fr) minmax(480px, 1.2fr); gap: 36px; align-items: start; }
  .winner { display: flex; align-items: center; gap: 18px; background: var(--navy); color: #fff; border-radius: 14px; padding: 18px 24px; margin-bottom: 20px; }
  .winner .trophy { font-size: 46px; }
  .winner .eyebrow { color: var(--gold); }
  .winner h1 { color: #fff; font-size: 40px; }
  .winner .amt { margin-left: auto; text-align: right; font-family: var(--serif); font-size: 34px; font-weight: 700; }
  table.fin { width: 100%; border-collapse: collapse; font-size: 18px; }
  table.fin th { text-align: right; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); }
  table.fin th:nth-child(-n+2) { text-align: left; }
  table.fin td { padding: 10px 10px; border-bottom: 1px solid var(--panel); text-align: right; font-weight: 600; }
  table.fin td:nth-child(-n+2) { text-align: left; }
  table.fin td.nm { font-weight: 800; color: var(--navy); }
  table.fin td.tp { font-weight: 800; color: var(--navy); background: var(--gold-soft); }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { border: 0; background: var(--panel); color: var(--navy); font-weight: 700; border-radius: 8px; padding: 8px 14px; font-size: 15px; }
  .tabs button.on { background: var(--navy); color: #fff; }

  /* settings */
  .drawer { position: fixed; right: 16px; bottom: 84px; width: 360px; background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(31,39,97,.25); padding: 20px; z-index: 30; border: 1px solid var(--line); }
  .drawer h3 { font-size: 22px; margin-bottom: 12px; }
  .drawer .field input { font-size: 17px; padding: 10px 12px; }
  .drawer .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .drawer .btn { width: 100%; margin-top: 8px; font-size: 15px; padding: 11px; }
  .drawer .note { color: var(--muted); font-size: 13px; margin: -6px 0 12px; }

  @media (max-width: 1000px) {
    .lobby, .reveal, .final { grid-template-columns: 1fr; }
    .stage { padding: 20px 16px; }
    .head { padding: 10px 16px; }
    .prices { grid-template-columns: repeat(3, 1fr); }
    .timerbig { position: static; font-size: 44px; margin-bottom: 10px; }
    .joinbig .codebig { font-size: 72px; }
    body { overflow: auto; }
  }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="shell" id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/teacher.js"></script>
</body>
</html>
